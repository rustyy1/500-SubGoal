[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "YOUTUBE_HANDLE,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

[[redirects]]
  from = "/api/subscribers"
  to = "/.netlify/functions/subscribers"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
